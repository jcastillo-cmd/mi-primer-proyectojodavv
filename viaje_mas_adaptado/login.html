
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión | Viaje+</title>
    <link rel="stylesheet" href="css/estilos.css">

    <style>
        .login-contenedor {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f1fafa;
            padding: 20px;
        }

        .login-caja {
            background: white;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            border-radius: 15px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.08);
        }

        .login-caja h1 {
            text-align: center;
            color: #159e9a;
            margin-bottom: 10px;
        }

        .login-caja p {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        .login-caja label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .login-caja input {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 7px;
            box-sizing: border-box;
        }

        .login-caja button {
            width: 100%;
            padding: 13px;
            background: #159e9a;
            color: white;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            font-size: 16px;
        }

        .login-caja button:hover {
            background: #107d79;
        }

        .login-caja .volver {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #159e9a;
            text-decoration: none;
        }

        .mensaje-login {
            margin-top: 15px;
            font-weight: bold;
            text-align: center;
        }

        .mostrar {
            margin-top: -10px;
            margin-bottom: 15px;
        }

        .mostrar input {
            width: auto;
            margin: 0 5px 0 0;
        }
    </style>
</head>

<body>

    <div class="login-contenedor">

        <div class="login-caja">

            <h1>Viaje+</h1>
            <p>Bienvenido. Inicia sesión para continuar.</p>

            <form id="loginForm">

                <label for="correo">Correo electrónico</label>
                <input
                    type="email"
                    id="correo"
                    placeholder="Ingresa tu correo"
                    required
                >

                <label for="password">Contraseña</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Ingresa tu contraseña"
                    required
                >

                <div class="mostrar">
                    <input type="checkbox" id="verPassword">
                    <label for="verPassword" style="display:inline;">
                        Mostrar contraseña
                    </label>
                </div>

                <button type="submit">Iniciar sesión</button>

                <div id="mensajeLogin" class="mensaje-login"
                     role="status" aria-live="polite"></div>

            </form>

            <a href="index.html" class="volver">
                Volver al inicio
            </a>

        </div>

    </div>

    <script>

        // Seleccionamos los elementos del formulario
        const formulario = document.getElementById("loginForm");

        const correo = document.getElementById("correo");

        const password = document.getElementById("password");

        const mensaje = document.getElementById("mensajeLogin");

        const verPassword = document.getElementById("verPassword");


        // Mostrar u ocultar contraseña
        verPassword.addEventListener("change", function() {

            if (verPassword.checked) {
                password.type = "text";
            } else {
                password.type = "password";
            }

        });


        // Validar inicio de sesión
        formulario.addEventListener("submit", function(event) {

            event.preventDefault();

            const correoIngresado = correo.value.trim();

            const passwordIngresada = password.value;

            // Datos de acceso de prueba
            const correoCorrecto = "usuario@gmail.com";

            const passwordCorrecta = "123456";


            if (
                correoIngresado === correoCorrecto &&
                passwordIngresada === passwordCorrecta
            ) {

                mensaje.style.color = "green";

                mensaje.textContent = "¡Bienvenido a Viaje+!";

                // Redirigir a la página principal
                setTimeout(function() {
                    window.location.href = "index.html";
                }, 1500);

            } else {

                mensaje.style.color = "red";

                mensaje.textContent =
                    "Correo o contraseña incorrectos.";

            }

        });

    </script>

</body>
</html>
